# Publish a pre-built macOS DMG (compiled on a Mac) to JFrog Fly.
# Do not build the Tauri app here — GitHub-hosted runners cannot compile
# the macOS app (Xcode / Apple Silicon). Build locally, then create a
# GitHub Release that includes the DMG:
#
#   ./scripts/publish-release.sh
#
# This workflow then downloads that DMG and uploads it to Fly.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag (e.g. v2.1.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  distribute-dmg:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag and version
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$EVENT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: no release tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using tag $TAG (version $VERSION)"

      - name: Download DMG from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'UpDown_*.dmg' \
            --dir artifacts
          DMG=$(echo artifacts/UpDown_*.dmg)
          if [ ! -f "$DMG" ]; then
            echo "Error: no UpDown_*.dmg on release ${{ steps.meta.outputs.tag }}"
            echo "Build on a Mac with ./scripts/publish-release.sh and attach the DMG."
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Downloaded $DMG"
        id: dmg

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Upload DMG to JFrog Fly
        uses: jfrog/fly-action/upload@v1
        with:
          name: updown
          version: ${{ steps.meta.outputs.version }}
          files: ${{ steps.dmg.outputs.path }}

      - name: Distribute DMG on JFrog Fly
        uses: jfrog/fly-action/distribute@v1
        with:
          name: updown
          version: ${{ steps.meta.outputs.version }}
          type: generic
