name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org/

      - name: Build web app
        run: npm run build:web
        env:
          GITHUB_PAGES: true
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Add landing page
        run: |
          mkdir -p dist/_staging
          shopt -s dotglob
          for item in dist/*; do
            base="$(basename "$item")"
            case "$base" in
              _staging) continue ;;
            esac
            mv "$item" dist/_staging/
          done

          mkdir -p dist/app
          mv dist/_staging/* dist/app/
          rmdir dist/_staging
          cp dist/app/src/index.html dist/app/index.html
          sed -i 's|\.\./assets/|assets/|g' dist/app/index.html
          if [ -f dist/app/CNAME ]; then mv dist/app/CNAME dist/CNAME; fi

          cp docs/index.html dist/index.html
          cp docs/styles.css dist/styles.css
          cp docs/icon.png dist/icon.png
          cp docs/.nojekyll dist/.nojekyll
          cp -R docs/screenshots dist/screenshots

      - name: Package Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4.0.5
